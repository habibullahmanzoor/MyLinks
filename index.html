<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .profile {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-pic {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid #fff;
            margin-bottom: 12px;
            object-fit: cover;
            background: #444;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
            margin-right: auto;
            font-size: 40px;
        }

        .profile h1 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .profile p {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.7);
        }

        .links-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-card {
            display: block;
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            text-align: center;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.25s ease;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s ease;
        }

        .link-card:hover::before {
            left: 100%;
        }

        .link-card:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .link-card:active {
            transform: translateY(0);
        }

        .link-emoji {
            margin-right: 8px;
        }

        .footer {
            margin-top: 40px;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>

    <div class="profile">
        <div class="profile-pic">👤</div>
        <h1>Habib Ullah Manzoor</h1>
        <p>Best deals & links 👇</p>
    </div>

    <div class="links-container" id="linksContainer">
        <!-- Links are generated by JavaScript below -->
    </div>

    <div class="footer">Updated daily ✨</div>

    <script>
        // =============================================
        // 🔗 EDIT YOUR LINKS HERE
        // Just change this list! Add, remove, reorder.
        // =============================================
        const links = [
            { emoji: "🔥", text: "Verve AI", url: "https://vervecopilot.com/?utm_source=instagram&utm_medium=influencer&utm_campaign=habibullahmanzoor" },
            { emoji: "💰", text: "Claim Free Stocks", url: "https://join.robinhood.com/hanibum-8e5123" },
            {emoji: "📧", text: "Email Me", url: "mailto:habibullahmanzoor@gmail.com?subject=Hello%20Habib"},
            { emoji: "𝕏", text: "X.com", url: "https://x.com/Billu_Bhai_"},
        
 
        ];
        // =============================================
        // That's it! Everything below is automatic.
        // =============================================

        const container = document.getElementById('linksContainer');

        links.forEach(link => {
            const a = document.createElement('a');
            a.href = link.url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.className = 'link-card';
            a.innerHTML = `<span class="link-emoji">${link.emoji}</span>${link.text}`;
            container.appendChild(a);
        });
    </script>

</body>
</html>
