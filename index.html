<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .profile {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInUp 0.6s ease-out;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #fff;
            margin-bottom: 16px;
            object-fit: cover;
            animation: pulse 3s infinite, fadeInUp 0.6s ease-out;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }
        .profile-pic:hover {
            transform: scale(1.1) rotate(5deg);
        }

        .profile h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 6px;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4, #45b7d1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInUp 0.6s ease-out 0.1s both;
        }

        .profile p {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.7);
            animation: fadeInUp 0.6s ease-out 0.2s both;
        }

        .links-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            animation: fadeInUp 0.6s ease-out 0.3s both;
        }

        .link-card-wrapper {
            position: relative;
        }

        .link-card {
            display: block;
            width: 100%;
            padding: 18px 50px 18px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            color: #fff;
            text-decoration: none;
            text-align: center;
            font-size: 1.05rem;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            transform: translateY(0);
            cursor: pointer;
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.5s ease;
        }

        .link-card:hover::before {
            left: 100%;
        }

        .link-card:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }

        .link-card:active {
            transform: translateY(2px) scale(0.98);
        }

        .link-emoji {
            margin-right: 8px;
            animation: pulse 2s infinite;
            display: inline-block;
        }

        .copy-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.3);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s ease, background 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .link-card:hover .copy-btn {
            opacity: 1;
        }
        .copy-btn:hover {
            background: rgba(0,0,0,0.5);
        }

        .footer {
            margin-top: 40px;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.3);
            animation: fadeInUp 0.6s ease-out 0.5s both;
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #4ecdc4;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 1000;
            animation: fadeInUp 0.3s ease-out;
        }
    </style>
</head>
<body>

    <div class="profile">
        <img class="profile-pic" src="WhatsApp Image 2026-10-09 at 9.42.47 AM.jpeg" alt="Profile">
        <h1>Habib Ullah Manzoor</h1>
        <p>Best deals & links 👇</p>
    </div>

    <div class="links-container" id="linksContainer">
    </div>

    <div class="footer">Updated daily ✨</div>

    <script>
        const links = [
            { emoji: "📝", text: "Free CV Maker", url: "https://habibullahmanzoor.github.io/free-cv-maker/" },
            { emoji: "🔥", text: "Verve AI", url: "https://vervecopilot.com/?utm_source=instagram&utm_medium=influencer&utm_campaign=habibullahmanzoor" },
            { emoji: "💰", text: "Claim Free Stocks", url: "https://join.robinhood.com/hanibum-8e5123" },
            { emoji: "📧", text: "Email Me", url: "mailto:habibullahmanzoor@gmail.com?subject=Hello%20Habib" },
            
            { emoji: "📜", text: "LinkedIn Profile", url: "https://www.linkedin.com/in/habib-ullah-manzoor-phd-smieee-miet-19198994/" },
        ];

        const container = document.getElementById('linksContainer');

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('Link copied to clipboard!');
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('Link copied to clipboard!');
            });
        }

        links.forEach(link => {
            const wrapper = document.createElement('div');
            wrapper.className = 'link-card-wrapper';

            const a = document.createElement('a');
            a.href = link.url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.className = 'link-card';
            a.innerHTML = `<span class="link-emoji">${link.emoji}</span>${link.text}`;

            const copyBtn = document.createElement('button');
            copyBtn.className = 'copy-btn';
            copyBtn.innerHTML = '📋';
            copyBtn.title = 'Copy link';
            copyBtn.onclick = (e) => {
                e.stopPropagation();
                copyToClipboard(link.url);
            };

            wrapper.appendChild(a);
            wrapper.appendChild(copyBtn);
            container.appendChild(wrapper);
        });
    </script>

</body>
</html>
