<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#faf6f1">
<meta name="description" content="Links and scholarships from Habib Ullah Manzoor.">
<title>Habib Ullah Manzoor — Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#faf6f1;
    --white:#ffffff;
    --ink:#0e0e0f;
    --charcoal:#312e2e;
    --pewter:#52545a;
    --warm-gray:#76716f;
    --stone:#898c94;
    --sand:#dfddd8;
    --driftwood:#cbc7c3;
    --fog:#efefef;
    --ember:#ff3c00;
    --burnt:#ec4e02;
    --coral:#ff764c;
    --peach:#ffb199;
    --peach-wash:#fff1ec;

    --radius-card:24px;
    --radius-feature:28px;
    --radius-pill:100px;
    --max:440px;
    --safe-b:env(safe-area-inset-bottom,0px);
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}

  body{
    font-family:var(--font);
    background:
      radial-gradient(140% 55% at 50% -10%, rgba(255,177,153,.26), rgba(255,177,153,0) 62%),
      var(--canvas);
    color:var(--ink);
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    padding:clamp(30px,7vw,52px) 18px calc(32px + var(--safe-b));
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  .page{
    width:100%;max-width:var(--max);
    display:flex;flex-direction:column;align-items:center;
    position:relative;
  }

  /* ============ TOP-RIGHT SOCIAL BUTTON ============ */
  .social-btn{
    position:absolute;
    top:0;
    right:0;
    width:44px;height:44px;
    border-radius:50%;
    background:var(--white);
    border:1.5px solid var(--ember);
    color:var(--ember);
    display:grid;place-items:center;
    text-decoration:none;
    cursor:pointer;
    transition:background .2s ease,color .2s ease,transform .15s ease;
    animation:rise .55s cubic-bezier(.2,.7,.3,1) .04s both;
  }
  .social-btn svg{width:20px;height:20px;stroke-width:1.5;}
  .social-btn:hover{background:var(--ember);color:#fff;}
  .social-btn:active{transform:scale(.92);}

  /* ============ PROFILE ============ */
  .profile{
    display:flex;flex-direction:column;align-items:center;text-align:center;
    margin-bottom:18px;
    animation:rise .55s cubic-bezier(.2,.7,.3,1) both;
  }
  .avatar{
    width:110px;height:110px;border-radius:50%;padding:4px;
    background:var(--white);border:1px solid var(--sand);
    box-shadow:0 0 0 8px rgba(255,177,153,.16);
    margin-bottom:18px;
  }
  .avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:var(--fog);}

  .profile h1{
    font-size:clamp(1.55rem,6.8vw,1.95rem);
    font-weight:500;letter-spacing:-.03em;line-height:1.1;color:var(--ink);
  }
  .tagline{
    margin-top:8px;font-size:15px;font-weight:500;letter-spacing:-.01em;
    color:var(--warm-gray);
  }

  /* ============ TABS ============ */
  .tabs{
    display:flex;gap:4px;padding:4px;
    max-width:100%;overflow-x:auto;
    scrollbar-width:none;
    background:var(--white);border:1px solid var(--sand);
    border-radius:var(--radius-pill);
    margin-bottom:22px;
    animation:rise .55s cubic-bezier(.2,.7,.3,1) .06s both;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    appearance:none;border:none;background:transparent;cursor:pointer;
    flex:0 0 auto;
    padding:9px 15px;border-radius:var(--radius-pill);
    font-family:inherit;font-size:13.5px;font-weight:500;letter-spacing:-.01em;
    color:var(--pewter);white-space:nowrap;
    transition:background .2s ease,color .2s ease;
  }
  .tab:hover{color:var(--ink);background:var(--canvas);}
  .tab[aria-selected="true"]{background:var(--ember);color:#fff;}
  .tab[aria-selected="true"]:hover{background:var(--ember);color:#fff;}

  /* ============ VIEWS ============ */
  .view{width:100%;}
  .view[hidden]{display:none;}

  /* ============ LINK CARDS ============ */
  .links{width:100%;display:flex;flex-direction:column;gap:12px;}

  .card-wrap{
    position:relative;
    animation:rise .55s cubic-bezier(.2,.7,.3,1) backwards;
    animation-delay:calc(.06s + var(--i,0) * .05s);
  }

  .card{
    display:flex;align-items:center;gap:14px;width:100%;
    padding:13px 60px 13px 13px;
    background:var(--white);border:1px solid var(--sand);
    border-radius:var(--radius-card);
    color:var(--ink);text-decoration:none;position:relative;
    transition:border-color .2s ease,background .2s ease,transform .2s ease;
  }
  .card:hover{border-color:var(--ember);transform:translateY(-2px);}
  .card:active{transform:translateY(0) scale(.985);}

  .card.featured{
    background:var(--peach);border-color:var(--peach);
    border-radius:var(--radius-feature);
  }
  .card.featured:hover{background:#ffa487;border-color:var(--charcoal);}

  .card-icon{
    flex:0 0 auto;width:46px;height:46px;border-radius:14px;
    background:var(--canvas);border:1px solid var(--sand);
    display:grid;place-items:center;color:var(--ember);
    transition:background .2s ease,border-color .2s ease;
  }
  .card:hover .card-icon{background:var(--peach-wash);border-color:var(--peach);}
  .card.featured .card-icon{background:var(--white);border-color:rgba(49,46,46,.08);}
  .card-icon svg{width:22px;height:22px;}

  .card-text{display:flex;flex-direction:column;min-width:0;flex:1;}
  .card-title{font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.25;color:var(--ink);}
  .card-sub{
    margin-top:2px;font-size:13px;font-weight:400;line-height:1.3;
    color:var(--warm-gray);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .card.featured .card-sub{color:var(--charcoal);}

  .copy{
    position:absolute;right:11px;top:50%;transform:translateY(-50%);
    width:36px;height:36px;border-radius:50%;
    background:var(--white);
    border:1.5px solid var(--ember);
    color:var(--ember);
    display:grid;place-items:center;cursor:pointer;
    opacity:0;
    transition:opacity .2s ease,color .2s ease,background .2s ease,transform .15s ease;
  }
  .copy svg{width:15px;height:15px;stroke-width:1.8;}
  .copy:hover{background:var(--ember);color:#fff;}
  .copy:active{transform:translateY(-50%) scale(.9);}
  @media (hover:none){ .copy{opacity:1;} }
  @media (hover:hover){ .card-wrap:hover .copy{opacity:1;} }

  /* ============ SCHOLARSHIPS ============ */
  .search{
    display:flex;align-items:center;gap:10px;width:100%;
    padding:13px 16px;
    background:var(--white);border:1px solid var(--sand);
    border-radius:var(--radius-pill);
    transition:border-color .2s ease;
  }
  .search:focus-within{border-color:var(--ember);}
  .search svg{width:18px;height:18px;color:var(--stone);flex:0 0 auto;}
  .search input{
    border:none;outline:none;background:transparent;width:100%;
    font-family:inherit;font-size:16px;letter-spacing:-.01em;color:var(--ink);
  }
  .search input::placeholder{color:var(--stone);}
  .search input::-webkit-search-cancel-button{-webkit-appearance:none;}

  .count{
    margin:10px 4px 0;
    font-size:12px;font-weight:500;letter-spacing:.01em;color:var(--warm-gray);
  }

  .list{width:100%;margin-top:14px;display:flex;flex-direction:column;gap:12px;}

  .sch{
    background:var(--white);border:1px solid var(--sand);
    border-radius:var(--radius-card);
    padding:16px 16px 15px;
    transition:border-color .2s ease,opacity .2s ease;
    animation:rise .5s cubic-bezier(.2,.7,.3,1) backwards;
    animation-delay:calc(.06s + var(--i,0) * .04s);
  }
  .sch:hover{border-color:var(--driftwood);}
  .sch.closed{opacity:.62;}
  .sch.closed:hover{opacity:.78;}

  .sch-head{
    display:flex;align-items:flex-start;justify-content:space-between;
    gap:10px;
  }
  .sch-head-main{min-width:0;flex:1;}
  .sch-head-right{
    display:flex;align-items:center;gap:8px;flex:0 0 auto;
  }

  .sch-name{font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.3;color:var(--ink);}
  .sch-uni{
    margin-top:3px;
    font-size:13px;font-weight:500;letter-spacing:-.01em;line-height:1.3;
    color:var(--warm-gray);
  }

  .badge{
    flex:0 0 auto;padding:4px 9px;border-radius:999px;
    border:1px solid transparent;
    font-size:12px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;
  }
  .badge.open{background:var(--canvas);color:var(--pewter);border-color:var(--sand);font-weight:500;}
  .badge.soon{background:var(--peach-wash);color:#d93400;border-color:#ffd8ca;}
  .badge.closed{background:var(--fog);color:var(--warm-gray);}

  .copy-sch{
    flex:0 0 auto;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    height:30px;padding:0 12px;
    background:var(--white);
    border:1.5px solid var(--ember);
    border-radius:100px;
    color:var(--ember);
    font-family:inherit;
    font-size:12px;font-weight:600;letter-spacing:-.01em;
    cursor:pointer;
    white-space:nowrap;
    transition:background .2s ease,color .2s ease,transform .15s ease;
  }
  .copy-sch svg{width:13px;height:13px;stroke-width:1.8;}
  .copy-sch:hover{background:var(--ember);color:#fff;}
  .copy-sch:active{transform:scale(.94);}

  @media (max-width:380px){
    .copy-sch span{display:none;}
    .copy-sch{width:30px;padding:0;border-radius:50%;}
  }

  .sch-meta{
    margin-top:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;
    font-size:13px;letter-spacing:-.01em;color:var(--warm-gray);
  }
  .meta-item{display:inline-flex;align-items:center;gap:6px;}
  .meta-item svg{width:14px;height:14px;color:var(--stone);flex:0 0 auto;}

  .award{
    font-size:12px;font-weight:500;letter-spacing:-.01em;
    padding:2px 8px;border-radius:6px;
    background:var(--canvas);border:1px solid var(--sand);color:var(--pewter);
  }

  .apply{
    margin-top:14px;display:inline-flex;align-items:center;gap:7px;
    padding:10px 18px;
    background:var(--ember);color:#fff;
    border-radius:var(--radius-pill);
    font-size:13.5px;font-weight:600;letter-spacing:-.01em;text-decoration:none;
    transition:background .2s ease,transform .15s ease;
  }
  .apply svg{width:14px;height:14px;}
  .apply:hover{background:var(--burnt);}
  .apply:active{transform:scale(.97);}

  .empty{
    padding:30px 20px;text-align:center;
    font-size:14px;color:var(--warm-gray);
    border:1px dashed var(--driftwood);
    border-radius:var(--radius-card);
  }

  /* ============ PROMPTS ============ */
  .doc-card{
    display:flex;align-items:center;gap:14px;width:100%;
    padding:13px 16px 13px 13px;
    background:var(--peach);border:1px solid var(--peach);
    border-radius:var(--radius-feature);
    color:var(--ink);text-decoration:none;
    margin-bottom:14px;
    animation:rise .55s cubic-bezier(.2,.7,.3,1) backwards;
    animation-delay:.06s;
    transition:background .2s ease,border-color .2s ease,transform .15s ease;
  }
  .doc-card:hover{background:#ffa487;border-color:var(--charcoal);}
  .doc-card:active{transform:scale(.985);}
  .doc-card .card-icon{background:var(--white);border-color:rgba(49,46,46,.08);}
  .doc-card .card-sub{color:var(--charcoal);}
  .doc-card .doc-arrow{
    flex:0 0 auto;margin-left:auto;color:var(--charcoal);
    display:grid;place-items:center;
  }
  .doc-card .doc-arrow svg{width:18px;height:18px;}

  .prompt{
    background:var(--white);border:1px solid var(--sand);
    border-radius:var(--radius-card);
    padding:16px;
    display:flex;flex-direction:column;gap:10px;
    transition:border-color .2s ease;
    animation:rise .5s cubic-bezier(.2,.7,.3,1) backwards;
    animation-delay:calc(.06s + var(--i,0) * .04s);
  }
  .prompt:hover{border-color:var(--driftwood);}

  .prompt-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .prompt-title{font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.3;color:var(--ink);}
  .prompt-tag{
    flex:0 0 auto;padding:3px 9px;border-radius:999px;
    background:var(--peach-wash);border:1px solid #ffd8ca;color:#d93400;
    font-size:11px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;
  }

  .prompt-text{
    font-size:13.5px;line-height:1.55;letter-spacing:-.005em;
    color:var(--pewter);
    white-space:pre-wrap;
    display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;
    overflow:hidden;
  }
  .prompt.expanded .prompt-text{
    -webkit-line-clamp:unset;display:block;overflow:visible;
  }

  .prompt-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

  .btn-ghost{
    display:inline-flex;align-items:center;justify-content:center;
    height:30px;padding:0 12px;
    background:transparent;border:1px solid var(--sand);
    border-radius:100px;color:var(--pewter);
    font-family:inherit;font-size:12px;font-weight:600;letter-spacing:-.01em;
    cursor:pointer;white-space:nowrap;
    transition:background .2s ease,border-color .2s ease,color .2s ease;
  }
  .btn-ghost:hover{background:var(--canvas);border-color:var(--driftwood);color:var(--ink);}
  .btn-ghost:active{transform:scale(.96);}

  /* ============ FOOTER ============ */
  .footer{
    margin-top:28px;
    display:flex;flex-direction:column;align-items:center;gap:16px;
    animation:rise .55s cubic-bezier(.2,.7,.3,1) .35s backwards;
  }

  .share{
    display:inline-flex;align-items:center;gap:8px;
    padding:12px 22px;
    background:var(--ember);color:#fff;border:none;
    border-radius:var(--radius-pill);
    font-family:inherit;font-size:14px;font-weight:500;letter-spacing:-.01em;
    cursor:pointer;
    transition:background .2s ease,transform .15s ease;
  }
  .share:hover{background:var(--burnt);}
  .share:active{transform:scale(.96);}
  .share svg{width:16px;height:16px;}

  .updated{
    display:flex;align-items:center;gap:7px;
    font-size:12px;font-weight:500;letter-spacing:.01em;color:var(--warm-gray);
  }
  .updated .dot{width:6px;height:6px;border-radius:50%;background:var(--ember);}

  /* ============ TOAST ============ */
  .toast{
    position:fixed;left:50%;bottom:calc(26px + var(--safe-b));
    transform:translate(-50%,16px);
    display:flex;align-items:center;gap:8px;
    padding:12px 18px;
    background:var(--ink);color:#fff;border-radius:14px;
    font-size:13px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;
    opacity:0;pointer-events:none;z-index:999;
    transition:opacity .25s ease,transform .25s cubic-bezier(.2,.7,.3,1);
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}
  .toast .tick{color:var(--coral);font-size:14px;line-height:1;}

  /* ============ MOTION ============ */
  @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  :focus-visible{outline:2px solid var(--ember);outline-offset:3px;}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
  }
</style>
</head>
<body>

  <main class="page">

    <!-- top-right Instagram button -->
    <a class="social-btn" href="https://www.instagram.com/habibullahmanzoor/"
       target="_blank" rel="noopener noreferrer" aria-label="Instagram — @habibullahmanzoor">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"

        </svg>
        Share this page
      </button>
      <p class="updated"><span class="dot" aria-hidden="true"></span>Updated daily</p>
    </footer>

  </main>

  <script>
  /* ══════════════════════════════════════════════════════════════
     ╔══════════════════════════════════════════════════════════╗
     ║   👇  THIS IS THE ONLY PART YOU EVER NEED TO EDIT  👇    ║
     ╚══════════════════════════════════════════════════════════╝
     ══════════════════════════════════════════════════════════════ */

  /* ─────────────────────────────────────────────────────────────
     0) YOUR PROMPT DOC LINK
     ───────────────────────────────────────────────────────────── */
  const PROMPT_DOC_URL = "https://docs.google.com/document/d/1IMjhGzKPOTacooU4A0ksgkUAUVTfcc1m/preview";

  /* ─────────────────────────────────────────────────────────────
     1) LINKS
     To ADD a link: copy one { ... } block below, paste it just
     before the closing "];" and change the text.

        icon  → one of: file, sparkle, trend, mail, briefcase,
                        star, gift, book, globe, video
        title → the bold line
        sub   → the small grey line under it
        url   → where it goes
        featured: true → makes it the peach card (use on ONE only)
     ───────────────────────────────────────────────────────────── */
  const LINKS = [
    {
      icon: "globe",
      title: "News Pal",
      sub: "Stay informed, effortlessly",
      url: "https://tryit.cc/MUtPpGF",
      featured: true
    },
    {
      icon: "file",
      title: "Free CV Maker",
      sub: "Build a standout CV in minutes",
      url: "https://habibullahmanzoor.github.io/free-cv-maker/"
    },
    {
      icon: "book",
      title: "AI Prompt Library",
      sub: "My full collection of prompts",
      url: PROMPT_DOC_URL
    },
    {

  /* ══════════════════════════════════════════════════════════════

  /* ---------- tiny SVG icon set ---------- */

  const CAL_ICON   = svgWrap('<rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/>');
  const ARROW_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>';


  /* ---------- toast ---------- */
  let toastEl = null, toastTimer = null;
  function showToast(message){
    if (!toastEl){
      toastEl = document.createElement('div');
      toastEl.className = 'toast';
      document.body.appendChild(toastEl);
    }
    toastEl.innerHTML = '<span class="tick">✓</span><span></span>';
    toastEl.lastChild.textContent = message;
    requestAnimationFrame(() => toastEl.classList.add('show'));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1900);
  }

  /* ---------- clipboard ---------- */
  function legacyCopy(text, done){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
    done();
  }
  function copyToClipboard(text, message){
    const done = () => {
      if (navigator.vibrate) navigator.vibrate(12);
      showToast(message || 'Link copied!');
    };
    if (navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(done).catch(() => legacyCopy(text, done));
    } else {
      legacyCopy(text, done);
    }
  }


  /* ══════════════ RENDER: LINKS ══════════════ */
  const linksContainer = document.getElementById('linksContainer');

  LINKS.forEach((link, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'card-wrap';
    wrap.style.setProperty('--i', i);

    const a = document.createElement('a');
    a.className = 'card' + (link.featured ? ' featured' : '');
    a.href = link.url || '#';
    if (/^https?:/i.test(link.url || '')){
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
    }

    const icon = document.createElement('span');
    icon.className = 'card-icon';
    icon.innerHTML = ICONS[link.icon] || ICONS.file;

    const text = document.createElement('span');
    text.className = 'card-text';

    const title = document.createElement('span');
    title.className = 'card-title';
    title.textContent = link.title || 'Untitled link';

    const sub = document.createElement('span');
    sub.className = 'card-sub';
    sub.textContent = link.sub || '';

    text.append(title, sub);
    a.append(icon, text);

    const btn = document.createElement('button');
    btn.className = 'copy';
    btn.type = 'button';
    btn.innerHTML = COPY_ICON;
    btn.setAttribute('aria-label', 'Copy link: ' + (link.title || ''));
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      copyToClipboard(link.url || '');
    });

    wrap.append(a, btn);
    linksContainer.appendChild(wrap);
  });


  /* ══════════════ RENDER: SCHOLARSHIPS ══════════════ */
  const listEl   = document.getElementById('list');
  const countEl  = document.getElementById('count');
  const searchEl = document.getElementById('search');

  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function parseDeadline(str){
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(str || '').trim());
    if (!m) return null;
    return new Date(+m[1], +m[2] - 1, +m[3], 23, 59, 59, 999);
  }
  function formatDate(d){
    return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  }

  const NOW = Date.now();

  const items = SCHOLARSHIPS
    .map((s) => {
      const end = parseDeadline(s.deadline);
      const closed = end ? NOW > end.getTime() : false;
      const days = end ? Math.ceil((end.getTime() - NOW) / 86400000) : null;
      return { ...s, end, closed, days };
    })
    .sort((a, b) => {
      if (a.closed !== b.closed) return a.closed ? 1 : -1;
      if (a.closed) {
        return (b.end ? b.end.getTime() : 0) - (a.end ? a.end.getTime() : 0);
      }
      return (a.end ? a.end.getTime() : Infinity) - (b.end ? b.end.getTime() : Infinity);
    });

  function badgeFor(s){
    if (!s.end) return { text: 'Deadline TBA', cls: 'open' };
    if (s.closed) return { text: 'Closed', cls: 'closed' };
    if (s.days === 0) return { text: 'Closes today', cls: 'soon' };
    if (s.days === 1) return { text: '1 day left', cls: 'soon' };
    if (s.days <= 7) return { text: s.days + ' days left', cls: 'soon' };
    return { text: s.days + ' days left', cls: 'open' };
  }

  function cardFor(s, idx){
    const card = document.createElement('article');
    card.className = 'sch' + (s.closed ? ' closed' : '');
    card.style.setProperty('--i', idx);

    const head = document.createElement('div');
    head.className = 'sch-head';

    const headMain = document.createElement('div');
    headMain.className = 'sch-head-main';

    const name = document.createElement('h2');
    name.className = 'sch-name';
    name.textContent = s.name || 'Untitled scholarship';
    headMain.appendChild(name);

    if (s.uni){
      const uni = document.createElement('p');
      uni.className = 'sch-uni';
      uni.textContent = s.uni;
      headMain.appendChild(uni);
    }

    const headRight = document.createElement('div');
    headRight.className = 'sch-head-right';

    const copySch = document.createElement('button');
    copySch.className = 'copy-sch';
    copySch.type = 'button';
    copySch.innerHTML = COPY_ICON + '<span>Copy</span>';
    copySch.setAttribute('aria-label', 'Copy link: ' + (s.name || ''));
    copySch.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      copyToClipboard(s.link || '');
    });

    const b = badgeFor(s);
    const badge = document.createElement('span');
    badge.className = 'badge ' + b.cls;
    badge.textContent = b.text;

    headRight.append(copySch, badge);
    head.append(headMain, headRight);

    const meta = document.createElement('p');
    meta.className = 'sch-meta';

    const dateItem = document.createElement('span');
    dateItem.className = 'meta-item';
    dateItem.innerHTML = CAL_ICON;
    const dateText = document.createElement('span');
    dateText.textContent = s.end ? 'Closes ' + formatDate(s.end) : 'Deadline not announced';
    dateItem.appendChild(dateText);
    meta.appendChild(dateItem);

    if (s.award){
      const award = document.createElement('span');
      award.className = 'award';
      award.textContent = s.award;
      meta.appendChild(award);
    }

    card.append(head, meta);

    if (!s.closed && s.link){
      const a = document.createElement('a');
      a.className = 'apply';
      a.href = s.link;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.innerHTML = 'Apply ' + ARROW_ICON;
      card.appendChild(a);
    }

    return card;
  }

  function renderScholarships(){
    const q = searchEl.value.trim().toLowerCase();
    const shown = items.filter(s =>
      !q ||
      (s.name || '').toLowerCase().includes(q) ||
      (s.uni || '').toLowerCase().includes(q) ||
      (s.award || '').toLowerCase().includes(q)
    );

    listEl.replaceChildren();

    if (!shown.length){
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = q
        ? 'No scholarships match “' + q + '”.'
        : 'No scholarships yet — check back soon.';
      listEl.appendChild(empty);
    } else {
      shown.forEach((s, i) => listEl.appendChild(cardFor(s, i)));
    }

    const open = items.filter(s => !s.closed).length;
    const soon = items.filter(s => !s.closed && s.days !== null && s.days <= 7).length;
    let text = open + (open === 1 ? ' open scholarship' : ' open scholarships');
    if (soon) text += ' · ' + soon + ' closing soon';
    countEl.textContent = text;
  }

  searchEl.addEventListener('input', renderScholarships);
  renderScholarships();

      head.appendChild(tag);

    const body = document.createElement('p');
    body.className = 'prompt-text';
    body.textContent = p.text || '';

    const actions = document.createElement('div');
    actions.className = 'prompt-actions';

    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy-sch';
    copyBtn.type = 'button';
    copyBtn.innerHTML = COPY_ICON + '<span>Copy prompt</span>';
    copyBtn.setAttribute('aria-label', 'Copy prompt: ' + (p.title || ''));
    copyBtn.addEventListener('click', () => copyToClipboard(p.text || '', 'Prompt copied!'));

    actions.appendChild(copyBtn);

    if ((p.text || '').length > 200){
      const toggle = document.createElement('button');
      toggle.className = 'btn-ghost';
      toggle.type = 'button';
      toggle.textContent = 'Show more';
      toggle.addEventListener('click', () => {
        const open = card.classList.toggle('expanded');
        toggle.textContent = open ? 'Show less' : 'Show more';
      });
      actions.appendChild(toggle);
    }

    card.append(head, body, actions);
    promptsList.appendChild(card);
  });

  if (!PROMPTS.length){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'Tap the card above to open the full prompt library.';
    promptsList.appendChild(empty);
    docSub.textContent = 'Google Doc · open in a new tab';

  /* ══════════════ TAB SWITCHING ══════════════ */
  const tabs     = Array.from(document.querySelectorAll('.tab'));
  const views    = {
    links: document.getElementById('view-links'),
    scholarships: document.getElementById('view-scholarships'),
    prompts: document.getElementById('view-prompts')
  };

  const TAGLINES = {
    links: 'Best deals & links 👇',
    scholarships: 'Scholarships & funding 🎓',
    prompts: 'Copy-paste prompts 🤖'
  };

  function showView(name, pushHash){
    if (!views[name]) name = 'links';

    tabs.forEach(t => t.setAttribute('aria-selected', String(t.dataset.view === name)));

    Object.entries(views).forEach(([key, el]) => { el.hidden = key !== name; });

    tagline.textContent = TAGLINES[name];

    if (pushHash){
      const hash = name === 'links' ? '' : '#' + name;
      history.replaceState(null, '', location.pathname + location.search + hash);
    }
  }

  tabs.forEach(tab => {
    tab.addEventListener('click', () => showView(tab.dataset.view, true));
  });

  const startView = (location.hash || '').replace('#', '');
  showView(views[startView] ? startView : 'links', false);
